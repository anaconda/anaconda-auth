name: release

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch: {}  # Allows manually running test + SBOM generation without publishing

jobs:
  test:
    uses: ./.github/workflows/test.yml

  generate-sbom-conda:
    name: Generate SBOM (conda package)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Download the build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: conda-${{ github.sha }}
        path: ./conda-bld
    - name: Install the built package into a scan environment
      # Trivy's `fs` scan-type only reads *declared* dependency files (requirements.txt,
      # lock files, etc.) and can't introspect a built .conda/.tar.bz2 archive directly.
      # `rootfs` walks a real, installed environment (conda-meta/*.json), which is the
      # closest equivalent to scanning a container image filesystem for this artifact type.
      id: sbom-env
      run: |
        source $CONDA/bin/activate
        conda create -n sbom-scan --yes \
          -c ./conda-bld -c conda-forge -c defaults -c anaconda-cloud --override-channels \
          anaconda-auth
        echo "conda_root=$CONDA" >> "$GITHUB_OUTPUT"
    - name: Generate Trivy SBOM (conda)
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        scan-type: rootfs
        scan-ref: ${{ steps.sbom-env.outputs.conda_root }}
        format: 'spdx-json'
        output: 'trivy-conda-sbom.spdx.json'
    - name: Upload Trivy SBOM (conda)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: trivy-conda-sbom-${{ github.sha }}
        path: trivy-conda-sbom.spdx.json
        if-no-files-found: error

  generate-sbom-wheel:
    name: Generate SBOM (wheel)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Download the build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wheel-${{ github.sha }}
        path: ./dist
    - name: Install the built wheel into a scan environment
      # Trivy needs to see the wheel's dist-info/METADATA on disk within an installed
      # environment (not the raw .whl archive) to identify it and its dependencies.
      id: sbom-env
      run: |
        source $CONDA/bin/activate
        conda create -n sbom-scan --yes python=3.12 pip
        conda run -n sbom-scan pip install ./dist/*.whl
        echo "conda_root=$CONDA" >> "$GITHUB_OUTPUT"
    - name: Generate Trivy SBOM (wheel)
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        scan-type: rootfs
        scan-ref: ${{ steps.sbom-env.outputs.conda_root }}
        format: 'spdx-json'
        output: 'trivy-wheel-sbom.spdx.json'
    - name: Upload Trivy SBOM (wheel)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: trivy-wheel-sbom-${{ github.sha }}
        path: trivy-wheel-sbom.spdx.json
        if-no-files-found: error

  publish-conda-pkg-to-anaconda-dot-org:
    name: Publish conda package to Anaconda.org
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    needs: [test]
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - name: Create build environment
      run: |
        source $CONDA/bin/activate
        conda create -n build --file ./etc/build.linux-64.lock
    - name: Download the build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: conda-${{ github.sha }}
        path: ./conda-bld
    - name: publish
      env:
        TOKEN: ${{ secrets.ANACONDA_ORG_UPLOAD_TOKEN }}
      run: |
        source $CONDA/bin/activate && conda activate build
        # Use dev label for main branch pushes and pre-releases
        if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event.release.prerelease || 'false' }}" == "true" ]]; then
          export LABEL="--label dev"
        else
          export LABEL=""
        fi
        anaconda --verbose \
          --token $TOKEN \
          upload \
          --user anaconda-cloud \
          $LABEL \
          --force \
          ./conda-bld/noarch/anaconda-*

  publish-wheel-to-anaconda-dot-org:
    name: Publish wheel to Anaconda.org
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    needs: [test]
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - name: Download the build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wheel-${{ github.sha }}
        path: ./dist
    - name: Create build environment
      run: |
        source $CONDA/bin/activate
        conda create -n build --file ./etc/build.linux-64.lock
    - name: Upload to anaconda.org
      env:
        TOKEN: ${{ secrets.ANACONDA_ORG_UPLOAD_TOKEN }}
      run: |
        source $CONDA/bin/activate && conda activate build
        # Use dev label for main branch pushes and pre-releases
        if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event.release.prerelease || 'false' }}" == "true" ]]; then
          export LABEL="--label dev"
        else
          export LABEL=""
        fi
        anaconda --verbose \
          --token $TOKEN \
          upload \
          --user anaconda-cloud \
          $LABEL \
          --force \
          ./dist/*.whl

  publish-to-pypi:
    name: Publish to PyPI
    # Only publish to PyPI for regular releases (not pre-releases, not main pushes)
    if: github.event_name == 'release' && (github.event.release.prerelease || false) == false
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
    - name: Download the build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wheel-${{ github.sha }}
        path: ./dist
    - name: Install build dependencies
      run: pip install hatch
    - name: Upload to PyPI
      run: hatch publish
      env:
        HATCH_INDEX_USER: __token__
        HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}
